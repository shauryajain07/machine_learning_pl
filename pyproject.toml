[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "premier-league-openfootball"
version = "0.1.0"
description = "Premier League historical ingestion, recency-weighted ML and season simulation"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.3.4,<3.4",
    "scikit-learn>=1.5,<2",
    "numpy>=2,<3",
    "scipy>=1.14,<2",
    "joblib>=1.4,<2",
    "threadpoolctl>=3.5,<4",
    # MatchSense AI service layer
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]
llm = [
    "openai>=1.40,<3",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.matchsense" = ["static/*", "demo_data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
